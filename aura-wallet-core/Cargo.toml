[package]
name = "aura-wallet-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aura-common = { path = "../aura-common" }
aura-crypto = { path = "../aura-crypto" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
# wasm-bindgen / wasm-bindgen-futures are capped by libp2p-swarm 0.48, which pins
# wasm-bindgen-futures =0.4.58 (and through it wasm-bindgen =0.2.108) exactly.
wasm-bindgen = { version = "0.2.108", optional = true }
wasm-bindgen-futures = { version = "0.4.58", optional = true }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
console_error_panic_hook = { version = "0.1.7", optional = true }
uuid = { workspace = true }
multibase = { workspace = true }
hex = { workspace = true }
bincode = { workspace = true }
zeroize = { version = "1.9.0", features = ["derive"] }

[features]
default = []
wasm = ["wasm-bindgen", "wasm-bindgen-futures", "console_error_panic_hook"]

[lib]
crate-type = ["cdylib", "rlib"]
